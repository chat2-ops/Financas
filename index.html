<script>
(()=>{

async function onSession(s,off){const previousUserId=session&&session.user?session.user.id:null;session=s;offlineMode=!!off;clearTimeout(syncTimer);if(!s||previousUserId!==s.user.id){publicServices=[];publicServicesLoaded=false;editingPublicServiceId=null;publicWhatsappPhone=''}

async function boot(){if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});const themeButton=$('#theme-toggle');if(themeButton)themeButton.onclick=()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');

$('#logout').onclick=async()=>{if(!navigator.onLine||offlineMode||!sb){toast('Para sair, conecte-se à internet.');return}await syncNow();if(pending()&&!confirm('Há alterações que ainda não foram enviadas para a nuvem. Sair agora apaga essas alterações deste aparelho. Sair mesmo assim?'))return;const id=session&&session.user.id;const r=await sb.auth.signOut();if(r&&r.error){toast('Não consegui sair. Tente de novo.');return}try{localStorage.removeItem(cacheKey(id));localStorage.removeItem(LAST_KEY)}catch(e){}await onSession(null)};
window.addEventListener('offline',status);
window.addEventListener('online',async()=>{if(offlineMode&&sb){const {data}=await sb.auth.getSession();if(data.session)await onSession(data.session);else await onSession(null);return}if(session)await syncNow();status()});
setInterval(()=>{if(session&&!offlineMode&&navigator.onLine&&pending()&&!syncing)syncNow()},30000);
const last=lastUser(),hasCache=last&&localStorage.getItem(cacheKey(last.id));
if(!sb){if(hasCache){await onSession({user:last},true);return}$('#auth').hidden=false;authMsg('Sem internet. Entre uma vez com internet para usar o app off-line.');return}
let got={data:{session:null}};try{got=await sb.auth.getSession()}catch(e){got={data:{session:null},error:e}}

await onSession(null)}
function newId(){return (globalThis.crypto&&crypto.randomUUID)?crypto.randomUUID():`vf-${Date.now()}-${Math.random().toString(36).slice(2)}`;}
function toast(msg){const el=document.querySelector('#toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),2600)}
function setPage(p,id=null){if(page==='products'&&p!=='products'&&productPhotosBusy){toast('Aguarde as fotos terminarem de carregar.');return}if(page==='products'&&p!=='products'){editingProductId=null;pendingProductPhotos=[]}if(p!=='new-sale')selectedProductForSale=null;page=p;receiptId=id;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p||((p==='new-sale'||p==='edit-sale'||p==='receipt'||p==='warranty')&&b.dataset.page==='sales')||((p==='new-rental'||p==='edit-rental'||p==='rental')&&b.dataset.page==='rentals')));render()}
function setNav(){document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));}
function statusSale(s){if(s.installments.every(i=>i.paid))return 'Quitado';if(s.installments.some(i=>!i.paid&&i.due<todayISO()))return 'Atrasado';return 'Em dia'}
function calc(principal,n,monthly){principal=Math.round((Number(principal)||0)*100)/100;n=Math.max(1,parseInt(n)||1);const rate=(Number(monthly)||0)/100;const total=Math.round(principal*(1+rate*n)*100)/100;const installment=Math.round(total/n*100)/100;const amounts=Array(n).fill(installment);if(n>1)amounts[n-1]=Math.round((total-installment*(n-1))*100)/100;const interest=Math.round((total-principal)*100)/100;return {installment,total,interest,amounts};}
function installmentLabel(amounts){if(!amounts||!amounts.length)return '—';const first=amounts[0],last=amounts[amounts.length-1];if(amounts.length>1&&Math.abs(last-first)>=0.01)return `${amounts.length-1}x de ${money(first)} + última de ${money(last)}`;return `${amounts.length}x de ${money(first)}`}
function installmentSummary(s){return installmentLabel((s.installments||[]).map(i=>i.amount))}
function defaultDue(){return addMonth(todayISO(),1)}
function render(){advanceMonthIfNeeded();setNav();const root=document.querySelector('#view');if(page==='home')root.innerHTML=homeHTML();else if(page==='products')root.innerHTML=productsHTML();else if(page==='catalog')root.innerHTML=showcaseHTML();else if(page==='new-sale')root.innerHTML=saleFormHTML();else if(page==='edit-sale')root.innerHTML=saleFormHTML(receiptId);else if(page==='sales')root.innerHTML=salesHTML();else if(page==='receipt')root.innerHTML=receiptHTML(receiptId);else if(page==='warranty')root.innerHTML=warrantyReceiptHTML(receiptId);else if(page==='rentals')root.innerHTML=rentalsHTML();else if(page==='new-rental')root.innerHTML=rentalFormHTML();else if(page==='edit-rental')root.innerHTML=rentalFormHTML(receiptId);else if(page==='rental')root.innerHTML=rentalReceiptHTML(receiptId);bindPage();bindRental();if(page==='catalog')bindShowcase()}
function homeHTML(){const active=state.sales.length;const overdue=state.sales.filter(s=>statusSale(s)==='Atrasado').length;const outstanding=state.sales.reduce((sum,s)=>sum+(s.installments||[]).filter(i=>!i.paid).reduce((a,i)=>a+Number(i.amount||0),0),0);const stock=state.products.reduce((a,p)=>a+p.stock,0);const recent=[...state.sales].slice(-5).reverse();const month=validSalesMonth(selectedHomeMonth)?selectedHomeMonth:todayISO().slice(0,7);const monthLabel=new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(new Date(Number(month.slice(0,4)),Number(month.slice(5,7))-1,1));return `<div class="pagehead"><div><h1>Resumo da loja</h1><p>Vendas parceladas e produtos em estoque</p></div><button class="btn" data-go="new-sale">＋ Nova venda</button></div>
<div class="grid stats"><div class="card"><div class="stat-label">Vendas</div><div class="stat-value">${active}</div><div class="stat-sub">vendas cadastradas</div></div><div class="card"><div class="stat-label">A receber</div><div class="stat-value">${money(outstanding)}</div><div class="stat-sub">parcelas ainda não pagas</div></div><div class="card"><div class="stat-label">Atrasados</div><div class="stat-value">${overdue}</div><div class="stat-sub">contratos com vencimento passado</div></div><div class="card"><div class="stat-label">Unidades em estoque</div><div class="stat-value">${stock}</div><div class="stat-sub">celulares e acessórios</div></div></div>
<section class="card sales-month-card home-month-card"><div class="sales-month-toolbar"><div><h2 class="section-title">Resumo mensal</h2><p class="help">Confira vendas registradas, valores recebidos e parcelas com vencimento no mês.</p></div><label class="sales-year-select" for="home-month">Mês e ano<input id="home-month" class="home-month-input" type="month" value="${month}"></label></div><div id="home-month-summary">${homeMonthlySummaryHTML(month,monthLabel)}</div></section>
<div class="grid columns"><section class="card"><h2 class="section-title">Vendas recentes</h2>${recent.length?recent.map(s=>`<div class="row"><div class="recent-person"><span class="avatar">${esc(initials(s.customer))}</span><div><div class="row-title">${esc(s.customer)} • ${esc(saleDisplayName(s))}</div><div class="muted">${esc(saleCategory(s))} · ${isUpfrontSale(s)?salePaymentLabel(s):installmentSummary(s)} · ${esc(s.whatsapp)}</div></div></div><div class="recent-right"><strong class="amount">${money(s.total)}</strong><br><span class="badge ${statusSale(s)==='Atrasado'?'red':statusSale(s)==='Quitado'?'green':''}">${statusSale(s)}</span><br><button class="btn small secondary" data-receipt="${s.id}" style="margin-top:7px">Ver recibo</button></div></div>`).join(''):'<div class="empty">Ainda não há vendas. Cadastre produtos e depois lance sua primeira venda.</div>'}</section>
<section class="card"><h2 class="section-title">Atalhos</h2><div class="actions quick-actions"><button class="btn" data-go="new-sale">Nova venda</button><button class="btn secondary" data-go="products">Cadastrar produto</button><button class="btn ghost" data-export>Baixar cópia dos dados</button></div><div class="block-note"><strong>Bloqueio remoto não incluído.</strong> Requer integração específica e compatibilidade confirmada para cada modelo. Esta versão não bloqueia aparelhos.</div><p class="help">A cópia salva um arquivo JSON com seus dados. Guarde-o em local seguro.</p></section></div>`}
function homeMonthlySummaryHTML(month,label){let salesCount=0,salesTotal=0,received=0,pending=0;state.sales.forEach(s=>{const saleDate=String(s.saleDate||s.paymentDate||s.createdAt||s.firstDue||'').slice(0,7);if(saleDate===month){salesCount++;salesTotal+=Number(s.total)||Number(s.principal)||0}if(isUpfrontSale(s)){const item=(s.installments||[])[0],date=String(s.paymentDate||s.createdAt||s.firstDue||'').slice(0,10);if(date.slice(0,7)===month){if(item?.paid)received+=Number(s.total)||Number(item.amount)||0;else pending+=Number(s.total)||Number(item?.amount)||0}}else{(s.installments||[]).forEach(item=>{const due=String(item.due||'').slice(0,7);if(item.paid){const paidMonth=String(item.paidAt||item.due||'').slice(0,7);if(paidMonth===month)received+=Number(item.amount)||0}else if(due===month)pending+=Number(item.amount)||0})}});return `<div class="sales-month-summary home-month-summary"><div><small>Vendas registradas · ${esc(label)}</small><strong>${money(salesTotal)}</strong><span class="help">${salesCount} ${salesCount===1?'venda':'vendas'}</span></div><div><small>Recebido no mês</small><strong>${money(received)}</strong><span class="help">Pagamentos registrados neste mês</span></div><div><small>A receber no mês</small><strong>${money(pending)}</strong><span class="help">Parcelas com vencimento neste mês</span></div></div>${salesCount||received||pending?'':'<div class="empty home-month-empty">Não há vendas nem parcelas registradas neste mês.</div>'}`}
function compatNormalize(value){return String(value||'').toLocaleLowerCase('pt-BR').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function isAccessoryCategory(category){const value=compatNormalize(category);return value.includes('capinha')||value.includes('pelicula')}
function compatMatchesProduct(product,query){const q=compatNormalize(query);if(!q)return false;const listed=String(product.compatibleModels||'').split(/[;,\n]+/).map(compatNormalize).filter(Boolean),terms=[...listed,compatNormalize(product.name)].filter(Boolean);return terms.some(term=>term.includes(q))}
function syncCompatibleModelsField(){const form=$('#product-form'),field=$('#compatible-models-field');if(!form||!field)return;field.hidden=!isAccessoryCategory(form.elements.namedItem('category').value)}
function renderCompatibilitySearch(){const input=$('#compat-model-search'),root=$('#compat-search-results');if(!root)return;const query=(input?.value||'').trim();if(!query){root.innerHTML='<div class="empty">Digite o modelo do celular para ver as capinhas e películas cadastradas.</div>';return}const matches=state.products.filter(product=>isAccessoryCategory(product.category)&&compatMatchesProduct(product,query));if(!matches.length){root.innerHTML=`<div class="empty">Não encontrei capinha ou película no estoque para “${esc(query)}”. Se algum item servir para esse modelo, edite o produto e preencha “Modelos de celular compatíveis”.</div>`;return}const renderItems=items=>items.map(product=>`<article class="compat-item"><div class="compat-item-photo">${Array.isArray(product.photos)&&product.photos[0]?`<img src="${esc(product.photos[0])}" alt="">`:'<span>VF</span>'}</div><div class="compat-item-info"><div class="compat-item-title"><strong>${esc(displaySaleItemName(product.name,product.category))}</strong><span class="category-chip">${esc(product.category)}</span></div><small>Modelos: ${esc(product.compatibleModels||product.name)}</small><div class="compat-item-meta"><strong>${money(product.price)}</strong><span class="${product.stock>0?'compat-in-stock':'compat-out-stock'}">${product.stock>0?`${product.stock} un. em estoque`:'Sem estoque'}</span></div><button class="btn small secondary" data-use-compatible="${product.id}" ${product.stock>0?'':'disabled'}>${product.stock>0?'Escolher para venda':'Sem estoque'}</button></div></article>`).join(''),cases=matches.filter(product=>compatNormalize(product.category).includes('capinha')),films=matches.filter(product=>compatNormalize(product.category).includes('pelicula'));root.innerHTML=`<div class="compat-results-note">Produtos encontrados no seu estoque para: <strong>${esc(query)}</strong></div>${cases.length?`<div class="compat-group"><h3>Capinhas</h3><div class="compat-grid">${renderItems(cases)}</div></div>`:''}${films.length?`<div class="compat-group"><h3>Películas</h3><div class="compat-grid">${renderItems(films)}</div></div>`:''}`;root.querySelectorAll('[data-use-compatible]').forEach(button=>button.onclick=()=>{const product=state.products.find(item=>item.id===button.dataset.useCompatible);if(!product||product.stock<1){toast('Esse item está sem estoque.');return}selectedProductForSale=product.id;setPage('new-sale')})}

function renderCompatibilityGuideCards(){const root=$('#compat-guide-cards'),input=$('#compat-model-search');if(!root)return;const query=compatNormalize(input?.value||''),rows=COMPATIBILITY_GUIDE.filter(row=>!query||compatNormalize([row.brand,row.model,...row.compatible,row.note].join(' ')).includes(query));if(!rows.length){root.innerHTML='<div class="compat-guide-empty">Nenhum modelo encontrado nessa tabela.</div>';return}root.innerHTML=rows.map(row=>`<article class="compat-guide-card"><span class="compat-guide-brand ${compatGuideBrandClass(row.brand)}">${esc(row.brand)}</span><div class="compat-guide-model">${esc(row.model)}</div><div class="compat-guide-label">Compatível com:</div><div class="compat-guide-compatible">${row.compatible.map(value=>esc(value)).join(' / ')}${row.note==='Apenas película'?'<br><em>(Apenas película)</em>':`<span class="compat-guide-note">${esc(row.note)}</span>`}</div></article>`).join('')}
function productsHTML(){return `<div class="pagehead"><div><h1>Produtos e estoque</h1><p>Cadastre seus produtos e informe para quais modelos servem capinhas e películas.</p></div></div><div id="low-stock-alert" class="hidden" role="status" aria-live="polite"></div><div id="product-top-grid" class="grid columns"><section class="card"><h2 id="product-form-title" class="section-title">Novo produto</h2><form id="product-form" class="formgrid"><div class="field full"><label>Produto ou modelo</label><input name="name" required maxlength="70" placeholder="Ex.: Película 3D, capinha, iPhone 13"></div><div class="field"><label>Categoria</label><select name="category"><option>Celular</option><option>Película</option><option>Capinha</option><option>Carregador</option><option>Acessório</option><option>Outro</option></select></div><div class="field full" id="compatible-models-field" hidden><label>Modelos de celular compatíveis</label><input name="compatibleModels" maxlength="160" placeholder="Ex.: iPhone 11, iPhone 11 Pro"><small class="help">Separe os modelos por vírgula. Esse cadastro ajuda a busca por compatibilidade.</small></div><div class="field"><label>Quantidade inicial</label><input name="stock" type="number" min="0" step="1" value="1" required></div><div class="field"><label>Custo de compra por unidade (R$)</label><input name="cost" type="number" min="0" step="0.01" required placeholder="0,00"></div><div class="field"><label>Preço de venda por unidade (R$)</label><input name="price" type="number" min="0.01" step="0.01" required placeholder="0,00"></div><div class="field full"><label for="product-photos">Fotos do produto (até 5)</label><input id="product-photos" name="photos" type="file" accept="image/*" multiple><small class="help">Escolha até 5 fotos. Elas serão reduzidas para ocupar menos espaço.</small><div id="product-photo-preview" class="product-photo-preview"></div></div><div class="field full"><div class="actions"><button id="product-submit" class="btn" type="submit">＋ Salvar produto</button><button id="product-cancel" class="btn ghost hidden" type="button">Cancelar edição</button></div></div></form></section><section class="card"><h2 class="section-title">Resumo do estoque</h2><div id="stock-summary"></div></section></div><section class="card compat-search-card"><div class="compat-search-heading"><div><h2 class="section-title">Buscar acessórios por celular</h2><p class="help">Digite o modelo e toque em buscar para abrir os resultados do Google em uma nova aba.</p></div></div><form id="compat-google-form" class="compat-search-form" action="https://www.google.com/search" method="get" target="_blank"><input id="compat-model-search" type="search" placeholder="Ex.: iPhone 11, Galaxy A15..." aria-label="Modelo do celular" autocomplete="off"><input id="compat-google-query" type="hidden" name="q"><button class="btn secondary" type="submit">Buscar acessórios no Google</button></form><p class="compat-search-legend">A lista usa o nome do produto e os modelos compatíveis cadastrados no estoque; confira o resultado do Google antes de escolher.</p><div id="compat-search-results"><div class="empty">Digite o modelo do celular para ver as capinhas e películas cadastradas.</div></div></section><section class="card" style="margin-top:16px"><div class="stock-toolbar"><h2>Estoque atual</h2><div class="actions"><input id="product-search" type="search" placeholder="Buscar produto..." aria-label="Buscar produto"><button type="button" class="btn ghost" data-export-products>Exportar CSV</button><button type="button" class="btn secondary" data-export-products-pdf>Exportar PDF</button></div></div><div id="duplicate-alert"></div><div id="product-table"></div></section>`}

function showcaseProductMedia(p){const photos=Array.isArray(p.photos)?p.photos.filter(Boolean).slice(0,5):[];if(photos.length)return `<div class="showcase-photo-grid ${photos.length===1?'one':''}">${photos.map((src,i)=>`<img src="${esc(src)}" alt="Foto ${i+1} de ${esc(p.name)}">`).join('')}</div>`;return `<span class="showcase-glyph" aria-hidden="true">${p.category==='Celular'?'📱':p.category==='Carregador'?'🔌':p.category==='Película'?'▤':p.category==='Capinha'?'▯':'✦'}</span>`}
function renderShowcase(){const root=$('#showcase-products');if(!root)return;const term=($('#showcase-search')?.value||'').trim().toLocaleLowerCase('pt-BR'),all=sortProductsStock(state.products.filter(p=>(Number(p.stock)||0)>0)),shown=all.filter(p=>`${p.name} ${p.category}`.toLocaleLowerCase('pt-BR').includes(term)),count=$('#showcase-count');if(count)count.textContent=String(shown.length);if(!shown.length){root.innerHTML=`<div class="card empty">${all.length?'Nenhum produto encontrado.':'Não há produtos disponíveis para a vitrine no momento.'}</div>`;return}root.innerHTML=shown.map(p=>`<article class="showcase-card"><div class="showcase-media">${showcaseProductMedia(p)}</div><div class="showcase-info"><span class="category-chip">${esc(p.category)}</span><h2>${esc(p.name)}</h2><span class="badge green">Disponível</span></div><strong class="showcase-price">${money(p.price)}</strong></article>`).join('')}

function rentalFormHTML(editId=null){const old=editId?R().find(r=>r.id===editId):null,mode=old?.contractMode||'rent';const available=p=>p.stock+(old&&p.id===old.productId?1:0);const products=state.products.filter(p=>available(p)>0);const opts=products.map(p=>`<option value="${p.id}" ${old&&old.productId===p.id?'selected':''}>${esc(p.name)} — ${available(p)} em estoque</option>`).join('');const title=old?'Editar contrato':'Novo contrato';if(!products.length)return `<div class="pagehead"><div><h1>${title}</h1><p>Escolha um aparelho disponível no estoque.</p></div></div><section class="card"><div class="empty">Não há aparelho disponível para este contrato.</div><div class="actions"><button class="btn" data-go="products">Ver produtos</button></div></section>`;return `<div class="pagehead"><div><h1>${title}</h1><p>Escolha aluguel só de juros ou venda parcelada.</p></div></div><section class="card"><form id="rental-form"><div class="formgrid"><div class="field full"><label>Tipo de contrato</label><select name="contractMode"><option value="rent" ${mode==='rent'?'selected':''}>Aluguel — só juros; aparelho volta ao estoque</option><option value="sale" ${mode==='sale'?'selected':''}>Venda parcelada — aparelho + juros; não volta ao estoque</option></select><small class="help">No aluguel, as parcelas são somente juros sobre o valor inicial. Na venda, o total inclui o valor do aparelho e juros simples.</small></div><div class="field"><label>Nome do cliente</label><input name="customer" value="${esc(old?.customer||'')}" maxlength="70" required placeholder="Nome completo"></div><div class="field"><label>WhatsApp do cliente</label><input name="whatsapp" value="${esc(old?.whatsapp||'')}" type="tel" maxlength="20" required placeholder="DDD + número"></div><div class="field full"><label>Aparelho (do estoque)</label><select name="productId" required><option value="">Escolha um produto do estoque</option>${opts}</select></div><div class="field"><label>Valor inicial do aparelho (R$)</label><input name="deviceValue" type="number" min="0.01" step="0.01" value="${old?old.deviceValue:''}" required></div><div class="field"><label>Juros ao mês (%)</label><input name="rate" type="number" min="0.01" max="100" step="0.01" value="${old?old.rate:10}" required></div><div class="field"><label>Primeiro vencimento</label><input name="firstDue" type="date" value="${old?old.firstDue:defaultDue()}" required></div><div class="field"><label>Prazo / parcelas (meses)</label><input name="term" type="number" min="0" max="120" step="1" value="${old?old.term:0}" required><small class="help">Na venda parcelada, informe pelo menos 1 mês.</small></div></div><div class="block-note" id="rental-preview"></div><div class="actions" style="margin-top:12px"><button class="btn" type="submit">${old?'Salvar alterações':'Salvar contrato'}</button>${old?'<button class="btn ghost" type="button" data-rent-cancel-edit>Cancelar</button>':'<button class="btn ghost" type="button" data-go="rentals">Cancelar</button>'}</div></form></section>`}function previewRental(){const f=$('#rental-form');if(!f)return;const v=Number(f.deviceValue.value),rt=Number(f.rate.value),t=parseInt(f.term.value)||0,mode=f.contractMode.value,box=$('#rental-preview');if(!(v>0&&rt>0)){box.textContent='Informe o valor inicial e os juros para ver o cálculo.';return}if(mode==='sale'){if(t<1){box.textContent='Informe o número de parcelas da venda.';return}const result=calc(v,t,rt);box.innerHTML=`<strong>Parcela: ${money(result.installment)}</strong><br>${money(v)} de valor inicial + ${money(result.interest)} de juros simples (${pct(rt)} sobre o valor inicial ao mês) = <strong>${money(result.total)} em ${t} parcela${t===1?'':'s'}</strong><br><small>Venda parcelada: ao quitar, o aparelho não volta ao estoque.</small>`;return}const monthly=Math.round(v*rt)/100;box.innerHTML=`<strong>Juros do aluguel por mês: ${money(monthly)}</strong><br>${money(v)} × ${pct(rt)} sobre o valor inicial${t>0?` · total de juros em ${t} meses: ${money(monthly*t)}`:' · sem prazo definido'}<br><small>O aparelho sai do estoque enquanto estiver alugado e volta ao encerrar o aluguel.</small>`}function addRental(e){e.preventDefault();const f=e.currentTarget,p=state.products.find(x=>x.id===f.productId.value),mode=f.contractMode.value;if(!p||p.stock<1){toast('Escolha um aparelho com estoque.');return}const customer=f.customer.value.trim(),whatsapp=f.whatsapp.value.trim(),dv=Number(f.deviceValue.value),rate=Number(f.rate.value),firstDue=f.firstDue.value,term=parseInt(f.term.value)||0;if(!customer||!whatsapp||!firstDue||!(dv>0)||!(rate>0)||rate>100||term<0||term>120||(mode==='sale'&&term<1)){toast('Confira os dados do contrato.');return}const schedule=mode==='sale'?calc(dv,term,rate):null,monthly=mode==='sale'?schedule.installment:Math.round(dv*rate)/100,confirmation=mode==='sale'?`Registrar venda parcelada para ${customer}? ${money(dv)} + ${money(schedule.interest)} de juros = ${money(schedule.total)} em ${term} parcela(s) de ${money(schedule.installment)}. O aparelho não voltará ao estoque.`:`Salvar aluguel para ${customer}? Juros mensais: ${money(monthly)} (${pct(rate)} de ${money(dv)}). O aparelho volta ao estoque quando o aluguel for encerrado.`;if(!confirm(confirmation))return;p.stock-=1;const r={id:newId(),customer,whatsapp,productId:p.id,itemName:p.name,category:p.category,deviceValue:dv,rate,monthly,firstDue,term,contractMode:mode,payments:[],createdAt:todayISO()};if(schedule){r.paymentAmounts=schedule.amounts;r.totalAmount=schedule.total;r.interestTotal=schedule.interest}R().push(r);persist();setPage('rental',r.id);toast(mode==='sale'?'Venda parcelada salva.':'Aluguel salvo.')}function beginEditRental(id){const r=R().find(x=>x.id===id);if(!r)return;if(r.endedAt||r.payments.length){toast('Só é possível editar aluguel ativo antes de registrar pagamentos.');return}setPage('edit-rental',id)}
function updateRental(e){e.preventDefault();const old=R().find(x=>x.id===receiptId);if(!old){toast('Contrato não encontrado.');setPage('rentals');return}if(old.endedAt||old.payments.length){toast('Só é possível editar um contrato ativo antes de registrar pagamentos.');setPage('rental',old.id);return}const f=e.currentTarget,p=state.products.find(x=>x.id===f.productId.value),mode=f.contractMode.value,customer=f.customer.value.trim(),whatsapp=f.whatsapp.value.trim(),dv=Number(f.deviceValue.value),rate=Number(f.rate.value),firstDue=f.firstDue.value,term=parseInt(f.term.value);if(!p){toast('Escolha um aparelho do estoque.');return}const available=p.stock+(p.id===old.productId?1:0);if(available<1){toast('Não há estoque disponível para esse aparelho.');return}if(!customer||!whatsapp||!firstDue||!(dv>0)||!(rate>0)||rate>100||!Number.isInteger(term)||term<0||term>120||(mode==='sale'&&term<1)){toast('Confira os dados do contrato.');return}const schedule=mode==='sale'?calc(dv,term,rate):null,monthly=mode==='sale'?schedule.installment:Math.round(dv*rate)/100,confirmation=mode==='sale'?`Salvar venda parcelada de ${customer}? Total ${money(schedule.total)} em ${term} parcela(s) de ${money(schedule.installment)}. O aparelho não voltará ao estoque.`:`Salvar aluguel de ${customer}? Juros por mês: ${money(monthly)}. O aparelho volta ao estoque ao encerrar.`;if(!confirm(confirmation))return;const previous=state.products.find(x=>x.id===old.productId);if(previous)previous.stock+=1;p.stock-=1;Object.assign(old,{customer,whatsapp,productId:p.id,itemName:p.name,category:p.category,deviceValue:dv,rate,monthly,firstDue,term,contractMode:mode,updatedAt:todayISO()});if(schedule){old.paymentAmounts=schedule.amounts;old.totalAmount=schedule.total;old.interestTotal=schedule.interest}else{delete old.paymentAmounts;delete old.totalAmount;delete old.interestTotal}persist();setPage('rental',old.id);toast('Contrato atualizado.')}function payRental(id){const r=R().find(x=>x.id===id);if(!r||!rentActive(r))return;const i=r.payments.length,amount=rentalPaymentAmount(r,i),label=r.contractMode==='sale'?'parcela':'mensalidade';if(!confirm(`Registrar o pagamento da ${label} ${i+1} (${money(amount)}, vencimento ${fmtDate(rentDue(r,i))})? Confirme que recebeu.`))return;r.payments.push({i,amount,paidAt:todayISO()});persist();render();toast(r.contractMode==='sale'?'Parcela da venda registrada.':'Pagamento registrado.')}function undoRental(id){const r=R().find(x=>x.id===id);if(!r||r.endedAt||!r.payments.length)return;if(!confirm('Desfazer o último pagamento registrado?'))return;r.payments.pop();persist();render();toast('Pagamento desfeito.')}
function endRental(id){const r=R().find(x=>x.id===id);if(!r||r.endedAt)return;if(r.contractMode==='sale'){toast('Venda parcelada não devolve o aparelho ao estoque.');return}if(!confirm(`Encerrar o aluguel de ${r.customer}? O aparelho volta ao estoque.`))return;const p=state.products.find(x=>x.id===r.productId);if(p)p.stock+=1;r.endedAt=todayISO();persist();render();toast('Aluguel encerrado. Aparelho devolvido ao estoque.')}function deleteRental(id){const r=R().find(x=>x.id===id);if(!r)return;if(r.payments.length){toast(r.contractMode==='sale'?'A venda parcelada tem pagamentos registrados e não pode ser apagada.':'Há pagamentos registrados. Encerre o aluguel em vez de excluir.');return}if(!confirm(`Excluir o aluguel de ${r.customer}?${r.endedAt?'':' O aparelho volta ao estoque.'}`))return;if(!r.endedAt){const p=state.products.find(x=>x.id===r.productId);if(p)p.stock+=1}state.rentals=R().filter(x=>x.id!==id);persist();setPage('rentals');toast('Aluguel excluído.')}
function rentalReceiptHTML(id){const r=R().find(x=>x.id===id);if(!r){page='rentals';return rentalsHTML()}const sale=r.contractMode==='sale',st=rentStatus(r),on=rentActive(r),rows=r.term>0?r.term:r.payments.length+(on?3:0);let body='';for(let i=0;i<rows;i++){const pay=r.payments[i],due=rentDue(r,i),late=!pay&&due<todayISO(),amount=rentalPaymentAmount(r,i),action=pay?(i===r.payments.length-1&&!r.endedAt?`<button class="btn small ghost" data-rent-undo="${r.id}">Desfazer</button>`:''):(i===r.payments.length&&on?`<button class="btn small secondary" data-rent-pay="${r.id}">Marcar paga</button>`:'');body+=`<tr><td>${String(i+1).padStart(2,'0')}${r.term>0?' / '+r.term:''}</td><td>${fmtDate(due)}</td><td>${money(amount)}</td><td class="${pay?'paid':late?'late':''}">${pay?'Paga em '+fmtDate(pay.paidAt):late?'Atrasada':'Pendente'}</td><td class="no-print">${action}</td></tr>`}const typeTitle=sale?'Venda parcelada':'Aluguel';return `<div class="pagehead no-print"><div><h1>Recibo de ${typeTitle.toLocaleLowerCase('pt-BR')}</h1><p>Comprovante do contrato e das parcelas</p></div><div class="actions"><button class="btn ghost" data-go="rentals">Voltar</button>${!r.endedAt&&!r.payments.length?`<button class="btn secondary" data-rent-edit="${r.id}">Editar contrato</button>`:''}<button class="btn" data-print>Imprimir / salvar PDF</button><button class="btn secondary" data-rent-share="${r.id}">Compartilhar recibo</button>${!sale&&!r.endedAt?`<button class="btn secondary" data-rent-end="${r.id}">Encerrar aluguel</button>`:''}<button class="btn danger" data-rent-del="${r.id}">Excluir</button></div></div><section class="card receipt"><h2 class="receipt-title">${sale?'RECIBO DE VENDA PARCELADA':'RECIBO DE ALUGUEL'}</h2><div class="receipt-rule"></div><div class="receipt-lines"><p><strong>Cliente:</strong> ${esc(r.customer)}${r.whatsapp?` <span class="receipt-secondary">· WhatsApp: ${esc(r.whatsapp)}</span>`:''}</p><p><strong>Aparelho:</strong> ${esc(r.itemName)}</p><p><strong>Valor inicial:</strong> ${money(r.deviceValue)}</p>${sale?'':`<p><strong>Taxa mensal:</strong> ${pct(r.rate)} sobre o valor inicial</p>`}<p><strong>${sale?'Parcelas':'Prazo'}:</strong> ${r.term>0?r.term+' meses':'Sem prazo definido'}</p><p><strong>Primeiro vencimento:</strong> ${fmtDate(r.firstDue)}</p><p><strong>Contrato criado:</strong> ${fmtDate(r.createdAt)}</p></div>${sale?'':`<div class="receipt-rule"></div><div class="receipt-total-line"><span>VALOR / MENSALIDADE</span><span class="receipt-leader" aria-hidden="true"></span><strong>${money(r.monthly)}</strong></div><div class="receipt-statusline"><strong>Situação:</strong> ${esc(st)}${r.endedAt?` · Encerrado em ${fmtDate(r.endedAt)}`:''}</div><div class="receipt-footerline">VendaFácil · Aluguel; o aparelho volta ao estoque quando encerrado.</div>`}<div class="receipt-schedule-title">${sale?'PARCELAS DA VENDA':'PAGAMENTOS MENSAIS'}</div><table class="installments"><thead><tr><th>Parcela</th><th>Vencimento</th><th>Valor</th><th>Status</th><th class="no-print">Ação</th></tr></thead><tbody>${body}</tbody></table><div class="footer-note">${sale?'As parcelas incluem o valor inicial e o acréscimo calculado sobre o valor inicial.':'Os pagamentos mensais são calculados sobre o valor inicial; o valor do aparelho não é quitado e ele volta ao estoque quando o aluguel termina.'} Confirme o recebimento antes de registrar um pagamento.</div></section>`}function shareRental(id){const r=R().find(x=>x.id===id);if(!r)return;const sale=r.contractMode==='sale',text=`${sale?'RECIBO DE VENDA PARCELADA':'RECIBO DE ALUGUEL'}\nCliente: ${r.customer}\nAparelho: ${r.itemName}\nValor inicial: ${money(r.deviceValue)}\n${sale?'':'Taxa mensal: '+pct(r.rate)+' ao mês sobre o valor inicial'}\n${sale?`Total: ${money(r.totalAmount||r.monthly*r.term)} (${r.term} parcelas)\nAparelho vendido; não retorna ao estoque.`:`Valor mensal: ${money(r.monthly)}\n${r.term>0?'Prazo: '+r.term+' meses':'Sem prazo definido'}\nO aparelho volta ao estoque quando o aluguel for encerrado.`}\n\nPagamentos:\n${r.payments.length?r.payments.map((x,index)=>`Parcela ${String(index+1).padStart(2,'0')}: ${money(x.amount)} — pago em ${fmtDate(x.paidAt)}`).join('\n'):'Nenhum pagamento registrado ainda.'}\nPróximo vencimento: ${rentActive(r)?fmtDate(rentDue(r,r.payments.length)):'—'}\n\nComprovante gerado pelo controle da loja.`;if(navigator.share){navigator.share({title:sale?'Venda parcelada':'Recibo de aluguel',text}).catch(()=>{})}else if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>toast('Recibo copiado. Cole no WhatsApp.')).catch(()=>toast('Não foi possível copiar o recibo.'))}else{window.prompt('Copie o recibo:',text)}}
function bindRental(){const rentalMonth=$('#rental-month');if(rentalMonth)rentalMonth.onchange=()=>selectRentalMonth(rentalMonth.value);const search=$('#rental-search');if(search)search.oninput=()=>{const term=search.value.trim().toLocaleLowerCase('pt-BR');let shown=0;document.querySelectorAll('.sales-contract[data-rental-search]').forEach(row=>{const match=(row.dataset.rentalSearch||'').includes(term);row.classList.toggle('hidden',!match);if(match)shown++});const count=$('#rental-count');if(count)count.textContent=String(shown)};const q=(sel,fn)=>document.querySelectorAll(sel).forEach(fn);q('[data-rental]',b=>b.onclick=()=>setPage('rental',b.dataset.rental));q('[data-rent-edit]',b=>b.onclick=()=>beginEditRental(b.dataset.rentEdit));q('[data-rent-pay]',b=>b.onclick=()=>payRental(b.dataset.rentPay));q('[data-rent-undo]',b=>b.onclick=()=>undoRental(b.dataset.rentUndo));q('[data-rent-end]',b=>b.onclick=()=>endRental(b.dataset.rentEnd));q('[data-rent-del]',b=>b.onclick=()=>deleteRental(b.dataset.rentDel));q('[data-rent-share]',b=>b.onclick=()=>shareRental(b.dataset.rentShare));const cancel=$('[data-rent-cancel-edit]');if(cancel)cancel.onclick=()=>setPage('rental',receiptId);
const f=$('#rental-form');if(f){f.onsubmit=page==='edit-rental'?updateRental:addRental;f.oninput=previewRental;f.contractMode.onchange=previewRental;f.productId.onchange=()=>{const p=state.products.find(x=>x.id===f.productId.value);if(p&&p.price>0)f.deviceValue.value=p.price;previewRental()};previewRental()}}
const publicToken=new URLSearchParams(window.location.hash.replace(/^#/,'' )).get('vitrine');if(publicToken)openPublicShowcase(publicToken);else{render();boot();startMonthRolloverWatch()}
})();
</script>
